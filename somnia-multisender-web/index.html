<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09090b" />
    <title>Somnia Multisender — High-Performance Token Distribution</title>
    <meta name="description" content="Send native tokens and ERC-20 assets to multiple recipients in one flow on the Somnia high-performance blockchain." />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Somnia Multisender" />
    <meta property="og:description" content="Send native tokens and ERC-20 assets to multiple recipients in one flow." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Somnia Multisender {m} Logo" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Somnia Multisender" />
    <meta name="twitter:description" content="Send native tokens and ERC-20 assets to multiple recipients in one flow." />
    <meta name="twitter:image" content="/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <!-- Global Persistent Background Video Layer -->
    <video
      id="bg-video"
      autoplay
      loop
      muted
      playsinline
      preload="auto"
      aria-hidden="true"
    >
      <source src="/bg.mp4" type="video/mp4" />
    </video>
    <div id="bg-overlay" aria-hidden="true"></div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function() {
        var v = document.getElementById('bg-video');
        if (v) {
          v.defaultMuted = true;
          v.muted = true;
          var p = v.play();
          if (p && p.catch) p.catch(function(){});
        }
      })();
    </script>
  </body>
</html>
